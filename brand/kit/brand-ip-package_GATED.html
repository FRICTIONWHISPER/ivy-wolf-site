ate-columns:1fr}}\n.famcard{background:#141417;border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:20px 24px}\n.famcard .p{font-size:26px;font-weight:800;letter-spacing:-.03em}.famcard .p .wh{font-size:26px}.famcard .end{color:#76767E;font-size:12px;margin-top:6px}\n.sw-row{display:flex;gap:18px;flex-wrap:wrap}.sw{font-size:12px;color:#9A9A9A}.chip{display:inline-block;width:44px;height:44px;border-radius:8px;border:1px solid rgba(255,255,255,.15);margin-bottom:6px}\ntable.t,.doc table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}\ntable.t td,table.t th,.doc td,.doc th{border:1px solid rgba(255,255,255,.10);padding:8px 11px;text-align:left}table.t th,.doc th{background:#1c1c21;color:#fff}\n.doc{background:#141417;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:28px 34px;margin:20px 0}\n.doc h1{font-size:19px;color:#fff;margin:20px 0 8px;border-top:1px solid rgba(255,255,255,.09);padding-top:14px}.doc h1:first-child{border-top:0;padding-top:0}\n.doc h2.dt{font-size:22px;margin:0 0 2px}.doc .sub{color:#8a8a92;font-size:14px;margin:0 0 6px}\nblockquote{border-left:3px solid #5104FE;background:#17151f;margin:12px 0;padding:10px 16px;border-radius:8px;color:#c9c9d2}\nul,ol{padding-left:20px}li{margin:5px 0}code{background:#1c1c21;padding:1px 6px;border-radius:5px}\n.foot{color:#6a6a72;font-size:12px;margin-top:30px}</style></head><body><div class=\"watermark\"><span>Ivy Wolf Art wolf.</span></div><div class=\"wrap\"><div class=\"brandhead\">Ivy Wolf Art <span class=\"w\">wolf</span><span class=\"d\">.</span></div><div class=\"eyebrow\">Brand &amp; IP Package \u00b7 Wolf Co. \u00b7 v1.0</div><section class=\"brand-visuals\">\n<h2 class=\"sech\">The Brand</h2>\n<div class=\"hero\"><div class=\"lk\"><span class=\"mk\"><span class=\"fr\">Ivy Wolf Art</span> <span class=\"wh\">wolf</span><span class=\"per\">.</span></span></div></div>\n<div class=\"two\">\n  <div class=\"card light\"><div class=\"lk\"><span class=\"mk\"><span class=\"fr\">Ivy Wolf Art</span> <span class=\"wh\">wolf</span><span class=\"per\">.</span></span></div><div class=\"cap\">On light</div></div>\n  <div class=\"card mono\"><div class=\"lk\"><span class=\"mk\"><span class=\"fr\">Ivy Wolf Art</span> <span class=\"wh\">wolf</span><span class=\"per\">.</span></span></div><div class=\"cap\">Mono \u2014 the trademark / copyright drawing</div></div>\n</div>\n<div class=\"two\">\n  <div class=\"card\"><div class=\"stackmk\"><span class=\"fr\">Ivy Wolf Art<span class=\"per\">.</span></span><span class=\"wh\">wolf</span></div><div class=\"cap\">Stacked</div></div>\n  <div class=\"card icons\">\n     <div class=\"ic\"><span class=\"dot\"></span></div>\n     <div class=\"ic purple\"><span class=\"dotw\"></span></div>\n     <div class=\"cap\" style=\"width:100%\">Favicon / app icon \u2014 the dot</div>\n  </div>\n</div>\n\n<h2 class=\"sech\">Product family \u2014 the mark stays, the name swaps</h2>\n<div class=\"fam\"><div class=\"famcard\"><div class=\"p\"><span class=\"fr\">Ivy Wolf Art</span> <span class=\"wh\">wolf</span><span class=\"per\">.</span></div><div class=\"end\">a Wolf Co. collection</div></div></div>\n\n<h2 class=\"sech\">Palette</h2>\n<div class=\"sw-row\">\n  <div class=\"sw\"><span class=\"chip\" style=\"background:#0B0B0B\"></span>Ink<br><code>#0B0B0B</code></div>\n  <div class=\"sw\"><span class=\"chip\" style=\"background:#5104FE\"></span>Accent<br><code>#5104FE</code></div>\n  <div class=\"sw\"><span class=\"chip\" style=\"background:#FFFFFF\"></span>White<br><code>#FFFFFF</code></div>\n  <div class=\"sw\"><span class=\"chip\" style=\"background:#9A9A9A\"></span>Muted<br><code>#9A9A9A</code></div>\n  <div class=\"sw\"><span class=\"chip\" style=\"background:#6B6B6B\"></span>Muted-light<br><code>#6B6B6B</code></div>\n</div>\n\n<h2 class=\"sech\">Type</h2>\n<table class=\"t\"><tr><th>Part</th><th>Weight</th><th>Tracking</th></tr>\n<tr><td>Ivy Wolf Art</td><td>800 Heavy</td><td>-4%</td></tr>\n<tr><td>wolf</td><td>200 Ultralight</td><td>+16%</td></tr>\n<tr><td>. period</td><td>800 (accent)</td><td>flush</td></tr></table>\n</section><h2 class=\"sech\">The Documents</h2><div class=\"doc\"><h2 class=\"dt\">Brand & IP Package \u2014 Plan</h2>\n<p class=\"sub\">What each package contains, who files it, cost, status</p>\n<h1>1. Purpose</h1>\n<p>This is the master plan for the Ivy Wolf Art Brand &amp; Intellectual Property package. It lists every\ndocument in the set, what each contains, who files it, where, the cost, and its status. Read this first.</p>\n<blockquote><p>NOTE: This is paperwork built to a standard, not legal advice. A trademark attorney should\nconfirm the filing plan and run a clearance search before filing.</p></blockquote>\n<h1>2. The Packages</h1>\n<table><thead><tr><th>#</th><th>Package</th><th>What's inside</th><th>Filed by / where</th><th>Est. cost</th><th>Status</th></tr></thead>\n<tbody>\n<tr><td>01</td><td>Brand Book</td><td>Logo (E1 wordmark), colors, type, lockups, favicon, usage + TM-symbol rules</td><td>Reference (not filed)</td><td>\u2014</td><td>Locked</td></tr>\n<tr><td>02</td><td>Trademark Filing \u2014 Ivy Wolf Art</td><td>Word-mark worksheet (Class 016), owner block, goods/services, basis, specimen, B&amp;W drawing</td><td>USPTO Trademark Center</td><td>~$350</td><td>Ready to file</td></tr>\n<tr><td>03</td><td>Copyright Filing \u2014 Ivy Wolf Art</td><td>Code-copyright deposit guide (Circular 61), author/claimant, specimen checklist</td><td>copyright.gov</td><td>~$45-65</td><td>Ready to file</td></tr>\n</tbody></table>\n<h2>Website reference &amp; access</h2>\n<table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>\n<tr><td>Web address</td><td>https://ivy-wolf.com/brand-package</td></tr>\n<tr><td>Username</td><td>[access username]</td></tr>\n<tr><td>Password</td><td>[set in config \u2014 never hardcoded]</td></tr>\n<tr><td>Protection</td><td>Client-side password gate + noindex</td></tr>\n</tbody></table>\n<h1>3. The Model We're Using</h1>\n<blockquote><p>NOTE: House-mark trademark <strong>once</strong> + per-app <strong>code copyright</strong> +\n<strong>&trade;</strong> on every product name for free common-law rights. Federally register a product name only when it earns.</p></blockquote>\n<h1>4. What Camilla Does</h1>\n<ol>\n<li>File the <strong>IVY WOLF ART</strong> word mark at the USPTO Trademark Center (Class 016); attach the specimen.</li>\n<li>File the <strong>Ivy Wolf Art</strong> code copyright at copyright.gov (first 25 + last 25 pages of source).</li>\n<li>Put <strong>&trade;</strong> on Ivy Wolf Art and every product name now.</li>\n</ol>\n<h1>5. Owner (on every filing)</h1>\n<table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody><tr><td>Owner / claimant</td><td>Wolf Co.</td></tr><tr><td>Entity type</td><td>TBD-PIC</td></tr><tr><td>State / ID</td><td>Wyoming / TBD-PIC</td></tr><tr><td>General Partner</td><td>TBD-PIC</td></tr><tr><td>Address</td><td>TBD-PIC</td></tr><tr><td>Registered Agent</td><td>TBD-PIC</td></tr></tbody></table>\n</div><div class=\"doc\"><h2 class=\"dt\">Ivy Wolf Art \u2014 Brand Book</h2>\n<p class=\"sub\">Logo, colors, type, lockups, definitions, usage, access</p>\n<h1>1. The Logo</h1>\n<p>The Ivy Wolf Art logo is a wordmark \u2014 the word does the work. \"Ivy Wolf Art\" is set heavy and tight;\n\"wolf\" is set light and airy; a small accent period closes it. No separate symbol. The mark is the word; the dot is the icon.</p>\n<p>The wordmark is: <strong>Ivy Wolf Art wolf.</strong></p>\n<blockquote><p>NOTE: The logo is a human-finalized, outlined vector \u2014 not live font text, not raw AI output. A person authored the final art, which keeps the copyright clean.</p></blockquote>\n<h1>2. Colors</h1>\n<table><thead><tr><th>Role</th><th>Hex</th><th>Use</th></tr></thead><tbody>\n<tr><td>Ink (black)</td><td>#0B0B0B</td><td>dark backgrounds; the words on light</td></tr>\n<tr><td>White</td><td>#FFFFFF</td><td>the words on dark</td></tr>\n<tr><td>Accent (purple)</td><td>#5104FE</td><td>the period / the dot only</td></tr>\n<tr><td>Muted (on dark)</td><td>#9A9A9A</td><td>the \"wolf\" word on dark</td></tr>\n<tr><td>Muted (on light)</td><td>#6B6B6B</td><td>the \"wolf\" word on light</td></tr>\n</tbody></table>\n<h1>3. Type</h1>\n<table><thead><tr><th>Part</th><th>Weight</th><th>Tracking</th></tr></thead><tbody>\n<tr><td>Ivy Wolf Art</td><td>800 (Heavy)</td><td>-4%</td></tr>\n<tr><td>wolf</td><td>200 (Ultralight)</td><td>+16%</td></tr>\n<tr><td>. (period)</td><td>800 (accent)</td><td>flush</td></tr>\n</tbody></table>\n<p>Typeface: SF Pro Display on screen; the logo file is outlined vector. Fallback: Helvetica / Arial.</p>\n<h1>4. Lockups</h1>\n<ul>\n<li><strong>Master:</strong> Ivy Wolf Art wolf.</li>\n<li><strong>Product:</strong> the master style with the product name \u2014 plus a small line, \"a Ivy Wolf Art wolf app\". The mark stays constant; only the name changes.</li>\n<li><strong>Stacked:</strong> \"Ivy Wolf Art\" over \"wolf\" for square / avatar spaces.</li>\n<li><strong>Icon / favicon:</strong> the accent dot on a dark tile.</li>\n<li><strong>Four color versions:</strong> on dark, on light, mono black-and-white (the registration drawing), reversed white.</li>\n</ul>\n<h1>5. Usage Rules</h1>\n<blockquote><p>TIP: Keep the weight contrast (Heavy vs Ultralight). Keep the accent on the period/dot only. Keep clear space of one cap-height. Minimum width 110px \u2014 below that, use the dot.</p></blockquote>\n<blockquote><p>WARNING: Do not change the two weights or the tracking, do not color the words with the accent, do not add shadows or effects, do not stretch it, and do not rebuild it from live font text for print.</p></blockquote>\n<p>Trademark symbol: use <strong>&trade;</strong> now; switch to <strong>&reg;</strong> only after the mark is federally registered.</p>\n<h1>6. Definitions (glossary)</h1>\n<table><thead><tr><th>Term</th><th>What it means</th></tr></thead><tbody>\n<tr><td>Wordmark</td><td>A logo made of styled text (the name), with no separate symbol.</td></tr>\n<tr><td>House mark</td><td>The umbrella brand name that sits on every product \u2014 Ivy Wolf Art.</td></tr>\n<tr><td>Product lockup</td><td>The house style applied to a product name.</td></tr>\n<tr><td>Favicon / app icon</td><td>The small square mark \u2014 the accent dot on a dark tile.</td></tr>\n<tr><td>Clear space</td><td>The empty margin kept around the logo (one cap-height).</td></tr>\n<tr><td>Mono / B&amp;W version</td><td>The all-black logo on white \u2014 the trademark and copyright drawing.</td></tr>\n</tbody></table>\n<h1>7. The Brand Package Assets</h1>\n<p>The full asset set: <code>primary_on-dark.svg</code>, <code>primary_on-light.svg</code>,\n<code>mono-black_REGISTRATION.svg</code>, <code>stacked.svg</code>, <code>favicon_dot.svg</code> (+ favicon PNGs 512/192/180/32/16).</p>\n<h1>8. Website &amp; Access (permanent reference)</h1>\n<table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>\n<tr><td>Web address</td><td>https://ivy-wolf.com/brand-package</td></tr>\n<tr><td>Username</td><td>[access username]</td></tr>\n<tr><td>Password</td><td>[set in config \u2014 never hardcoded]</td></tr>\n<tr><td>Protection</td><td>Client-side password gate + noindex</td></tr>\n</tbody></table>\n</div><div class=\"doc\"><h2 class=\"dt\">Trademark Filing \u2014 Ivy Wolf Art</h2>\n<p class=\"sub\">Word mark, Class 016 \u2014 for the USPTO Trademark Center</p>\n<h1>1. The Mark</h1>\n<p>Standard-character (word) mark: <strong>IVY WOLF ART</strong></p>\n<p>We file the word mark first because it protects the name in any font, size, or color \u2014 the broadest and cheapest protection of the brand name.</p>\n<blockquote><p>NOTE: Statement filed with the mark \u2014 no claim is made to any particular font style, size, or color.</p></blockquote>\n<h1>2. Owner</h1>\n<table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody><tr><td>Owner / claimant</td><td>Wolf Co.</td></tr><tr><td>Entity type</td><td>TBD-PIC</td></tr><tr><td>State / ID</td><td>Wyoming / TBD-PIC</td></tr><tr><td>General Partner</td><td>TBD-PIC</td></tr><tr><td>Address</td><td>TBD-PIC</td></tr><tr><td>Registered Agent</td><td>TBD-PIC</td></tr></tbody></table>\n<h1>3. Classification</h1>\n<p>International Class <strong>016</strong> (software as a service).</p>\n<p>Goods/services: Original paintings; limited-edition reproductions of original paintings; commissioned original artworks.</p>\n<blockquote><p>TIP: The USPTO rejects vague identifications like \"software.\" State exactly what the software does \u2014 keep it specific.</p></blockquote>\n<h1>4. Basis and Specimen</h1>\n<p>Filing basis: <strong>1(b) intent to use</strong>.</p>\n<p>Specimen: screenshot of the live ivy-wolf.com collection page showing the mark, a priced work, and the date</p>\n<h1>5. Fee and Symbol</h1>\n<p>Fee: about <strong>~$350</strong> for the one class. File via the USPTO Trademark Center.</p>\n<p>Symbol: use <strong>&trade;</strong> now; switch to <strong>&reg;</strong> only after the USPTO registers the mark.</p>\n<h1>6. Steps</h1>\n<ol>\n<li>Run a knockout search for IVY WOLF ART in Class 016 (attorney for a full clearance is recommended).</li>\n<li>Enter the mark as standard characters with the owner block above.</li>\n<li>Enter Class 016 with the goods/services wording above; basis 1(b) intent to use; attach the specimen.</li>\n<li>Pay and file. Keep the confirmation for the records.</li>\n</ol>\n</div><div class=\"doc\"><h2 class=\"dt\">Copyright Filing \u2014 Ivy Wolf Art</h2>\n<p class=\"sub\">Software code copyright \u2014 for copyright.gov</p>\n<h1>1. What This Protects</h1>\n<p>This registers the copyright in the <strong>Ivy Wolf Art</strong> software \u2014 the actual code \u2014\nso it is protected against copying. It is separate from the trademark, which protects the brand name.</p>\n<blockquote><p>NOTE: File at copyright.gov. Deposit rules follow U.S. Copyright Office Circular 61 (Computer Programs). Paperwork to a standard, not legal advice.</p></blockquote>\n<h1>2. What to Deposit</h1>\n<ul>\n<li>The <strong>first 25 pages</strong> and the <strong>last 25 pages</strong> of the source code for the version being registered.</li>\n<li>If the whole program is <strong>50 pages or fewer</strong>, deposit the entire source and say so.</li>\n<li>Trade-secret portions may be <strong>blacked out</strong>, as long as the redacted part stays under half and visible code still shows meaningful copyrightable expression.</li>\n<li>Include the page that bears any copyright notice.</li>\n</ul>\n<h1>3. Application Fields</h1>\n<table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>\n<tr><td>Work</td><td>Computer program \u2014 \"Ivy Wolf Art\"</td></tr>\n<tr><td>Author</td><td>The developer, or the owner entity as a work made for hire</td></tr>\n<tr><td>Claimant</td><td>Wolf Co.</td></tr>\n</tbody></table>\n<blockquote><p>WARNING: If a contractor wrote any of the code, get a signed assignment to Wolf Co. \u2014 otherwise the contractor can own the copyright even though you paid for it.</p></blockquote>\n<h1>4. Specimen / Use Checklist (for the related trademark)</h1>\n<p>A trademark specimen must be a real screenshot (not a mockup) that shows:</p>\n<ul>\n<li>the mark shown next to the service,</li>\n<li>a Login (or sign-in) button,</li>\n<li>a subscription / service context (not a one-time product),</li>\n<li>the page URL and the date captured.</li>\n</ul>\n<h1>5. Fee and Repeat</h1>\n<p>Fee: a single electronic registration is roughly <strong>~$45-65</strong>.</p>\n<p>Repeat this same process per app as each one ships. That is the per-app copyright half of the model.</p>\n</div><p class=\"foot\">&copy; 2026 Wolf Co.. Proprietary &amp; Confidential. Generated via brand-kit-whisper. Not legal advice.</p></div></body></html>";async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function go(){var v=document.getElementById('pw').value;if(await sha(v)===H){document.open();document.write(DOC);document.close()}else{document.getElementById('err').textContent='Wrong password.'}}</script></body></html>
